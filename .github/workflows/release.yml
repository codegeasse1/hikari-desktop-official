name: Build and Release

# Continuous delivery: every CODE push to main builds, signs, and publishes
# a new installer over the previous one (same AppId, higher AppVersion).
# Docs-only changes (readme, changelogs, docs, license) skip the build.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG*'
      - 'changelog*'
      - 'LICENSE*'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Versioned tags (v1.2.3) release that exact version; every other code
      # push ships a continuous build numbered by the run, which always
      # counts as NEWER than the last one, so installers upgrade in place.
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name && format('{0}', github.ref_name) || format('0.1.{0}', github.run_number) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Verify tag is on main
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        git fetch origin main
        if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
          echo "❌ Error: Release tags must be on the main branch! Aborting release."
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download and inject libmpv-2.dll (latest build)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "desktop-app/appResources/windows/mpv"

        Write-Host "Fetching pinned libmpv release (20261018) from shinchiro/mpv-winbuild-cmake..."
        $headers = @{
          "Accept" = "application/vnd.github.v3+json"
          "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
        }
        $release = $null
        try {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20261018" -Headers $headers
        } catch {
          Write-Host "Pinned tag is gone - resolving the newest release instead"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
        }
        $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" } | Select-Object -First 1

        if ($null -eq $asset) {
          Write-Error "Could not find a matching mpv-dev-x86_64-*.7z asset in the latest release!"
          exit 1
        }

        Write-Host "Downloading: $($asset.name) from $($asset.browser_download_url)"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
        7z e mpv-dev.7z "libmpv-2.dll" -o"desktop-app/appResources/windows/mpv" -r

        if (-not (Test-Path "desktop-app/appResources/windows/mpv/libmpv-2.dll")) {
          Write-Error "libmpv-2.dll was not extracted! The release asset structure may have changed."
          exit 1
        }
        Write-Host "libmpv-2.dll ready."

    - name: Build App (createDistributable)
      shell: bash
      run: |
        # APP_VERSION is v1.2.3 on version tags, 0.1.<run> on continuous builds.
        # Strip a leading v if present (v1.2.3 -> 1.2.3).
        VERSION=${APP_VERSION#v}
        ./gradlew :desktop-app:createDistributable -PAPP_VERSION=$VERSION --no-daemon

    - name: Stamp installer version (higher AppVersion = upgrade, not side-by-side)
      shell: bash
      run: |
        # Inno installs OVER the previous version only when the AppId is stable
        # (installer/setup.iss, never change it) AND AppVersion increases.
        # Strip any -suffix from the version: Inno/jpackage need a plain number.
        VERSION=${APP_VERSION#v}
        INNO_VER=${VERSION%%-*}
        echo "#define AppVersion \"$INNO_VER\"" > installer/version.iss
        cat installer/version.iss

    - name: Sign app executable (so the installed exe is already signed)
      shell: pwsh
      env:
        CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT }}
        CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        if ([string]::IsNullOrEmpty($env:CERT_B64)) {
          Write-Error "WINDOWS_SIGNING_CERT secret is empty. Set it to the base64 of your code-signing .pfx."
          exit 1
        }
        try {
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:CERT_B64))
        } catch {
          [IO.File]::WriteAllText("signing.pfx", $env:CERT_B64)
        }
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if ($null -eq $signtool) {
          Write-Error "signtool.exe not found. The Windows SDK should be preinstalled on this runner."
          exit 1
        }
        Write-Host "Using signtool: $($signtool.FullName)"
        $file = "desktop-app\build\compose\binaries\main\app\Hikari-Desktop\Hikari-Desktop.exe"
        if (-not (Test-Path $file)) {
          Write-Error "App exe not found at $file. The Compose output layout may have changed."
          exit 1
        }
        $signArgs = @("sign", "/f", "signing.pfx", "/d", "Hikari", "/du", "https://github.com/codegeasse1/hikari-desktop-official", "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
        if (-not [string]::IsNullOrEmpty($env:CERT_PASSWORD)) { $signArgs += @("/p", $env:CERT_PASSWORD) }
        $signArgs += $file
        & $signtool.FullName @signArgs
        if ($LASTEXITCODE -ne 0) {
          if ($signArgs -contains "/p") {
            Write-Host "Sign with password failed - retrying without /p (PFX may have no password)"
            $signArgs = $signArgs[0..($signArgs.IndexOf("/p") - 1)] + $signArgs[($signArgs.IndexOf("/p") + 2)..($signArgs.Length - 1)]
            & $signtool.FullName @signArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        & $signtool.FullName verify /a /v $file
        Remove-Item signing.pfx -Force

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"

    - name: Sign installer (SmartScreen trusts a signed installer)
      shell: pwsh
      env:
        CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT }}
        CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        if ([string]::IsNullOrEmpty($env:CERT_B64)) {
          Write-Error "WINDOWS_SIGNING_CERT secret is empty. Set it to the base64 of your code-signing .pfx."
          exit 1
        }
        try {
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:CERT_B64))
        } catch {
          [IO.File]::WriteAllText("signing.pfx", $env:CERT_B64)
        }
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if ($null -eq $signtool) {
          Write-Error "signtool.exe not found. The Windows SDK should be preinstalled on this runner."
          exit 1
        }
        Write-Host "Using signtool: $($signtool.FullName)"
        $file = "desktop-app\build\outputs\Hikari-Setup.exe"
        if (-not (Test-Path $file)) {
          Write-Error "Installer not found at $file. Check OutputDir/OutputBaseFilename in installer/setup.iss."
          exit 1
        }
        $signArgs = @("sign", "/f", "signing.pfx", "/d", "Hikari", "/du", "https://github.com/codegeasse1/hikari-desktop-official", "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
        if (-not [string]::IsNullOrEmpty($env:CERT_PASSWORD)) { $signArgs += @("/p", $env:CERT_PASSWORD) }
        $signArgs += $file
        & $signtool.FullName @signArgs
        if ($LASTEXITCODE -ne 0) {
          if ($signArgs -contains "/p") {
            Write-Host "Sign with password failed - retrying without /p (PFX may have no password)"
            $signArgs = $signArgs[0..($signArgs.IndexOf("/p") - 1)] + $signArgs[($signArgs.IndexOf("/p") + 2)..($signArgs.Length - 1)]
            & $signtool.FullName @signArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        & $signtool.FullName verify /a /v $file
        Remove-Item signing.pfx -Force

    - name: Publish release (versioned tag, or rolling continuous build)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        EXE=desktop-app/build/outputs/Hikari-Setup.exe
        ls -la "$EXE"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          TITLE="Hikari $VER"
          NOTES="Signed build for Windows (.exe installer). Installs over the previous version."
          LATEST="--latest"
        else
          TAG="continuous"
          TITLE="Continuous build"
          NOTES="Latest signed Hikari build for Windows (.exe installer), auto-built from main. Installs over the previous version."
          LATEST=""
        fi
        published=0
        for attempt in 1 2 3 4 5; do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release upload "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --clobber; then
              published=1
              echo "published $EXE to $TAG (attempt $attempt)"
              break
            fi
            echo "upload failed (attempt $attempt) — retrying in 10s"
            sleep 10
          else
            # shellcheck disable=SC2086
            if gh release create "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --notes "$NOTES" $LATEST; then
              published=1
              echo "release $TAG created (attempt $attempt)"
              break
            fi
            echo "release create failed (attempt $attempt) — retrying in 10s"
            sleep 10
          fi
        done
        if [ "$published" != "1" ]; then
          echo "FAILED to publish release after retries"
          exit 1
        fi
